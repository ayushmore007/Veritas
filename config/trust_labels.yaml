# Field-level trust labels for Phase 2 capture and Phase 8b verifier.
# trusted = measured from instrumentation; untrusted = attacker-controllable.

schema: cicflowmeter_80

trusted:
  description: Derived from packet timing/size observation; attacker can influence indirectly via evasion but not via text injection.
  fields:
    - Flow Duration
    - Total Fwd Packets
    - Total Backward Packets
    - Total Length of Fwd Packets
    - Total Length of Bwd Packets
    - Flow Bytes/s
    - Flow Packets/s
    - Fwd Packet Length Mean
    - Fwd Packet Length Std
    - Bwd Packet Length Mean
    - Bwd Packet Length Std
    - Flow IAT Mean
    - Flow IAT Std
    - Flow IAT Max
    - Flow IAT Min
    - Packet Length Mean
    - Packet Length Std
    - Packet Length Variance
    - FIN Flag Count
    - SYN Flag Count
    - RST Flag Count
    - ACK Flag Count
    - Down/Up Ratio
    - Average Packet Size
    - Packet Length Variance

untrusted:
  description: Attacker-controlled string or handshake-adjacent metadata; must pass sanitizer before agent.
  fields:
    - sni
    - alpn
    - quic_version
    - connection_id

provenance_rules:
  allow_verdict_ignore_requires: all_decisive_claims_traced_to_trusted
  replay_test: strip_untrusted_metadata_and_re_evaluate
